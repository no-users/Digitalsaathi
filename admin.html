<style>
:root{--g:#007800;--p:#FE28AF;--v:#9B00D2;--r:#DD603E;--bg:#FDFFF0;--card:#fff;--tx:#241632;--mu:#7a6f86;--ln:#ece7f1;--side:linear-gradient(180deg,#2b0a3d,#5a0a85)}
[data-t=dark]{--bg:#150d1c;--card:#21152c;--tx:#f3ecf8;--mu:#a597b3;--ln:#33223f}
*{box-sizing:border-box;margin:0;font-family:'Plus Jakarta Sans',sans-serif}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-size:14px}
button{cursor:pointer;border:0;font-weight:600;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--v);box-shadow:0 0 0 3px #9b00d222}
.err{border-color:var(--r)!important}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.btn{padding:10px 16px;border-radius:10px;background:var(--g);color:#fff;display:inline-flex;gap:8px;align-items:center}
.btn.alt{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}
.btn.bad{background:var(--r)}
.btn.sm{padding:6px 10px;font-size:12px}
#login{min-height:100vh;display:grid;place-items:center;background:var(--side);padding:20px}
#login form{background:var(--card);padding:36px;border-radius:22px;width:380px;max-width:100%;display:grid;gap:14px}
#login h1{font-size:24px;font-weight:800}
#login h1 b{color:var(--p)}
#app{display:flex;min-height:100vh}
aside{width:236px;background:var(--side);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .brand{font-weight:800;font-size:18px;padding:0 10px 18px}
aside .brand b{color:var(--p)}
.nav{background:0;color:#e5d3f3;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:11px;align-items:center}
.nav i{width:18px;text-align:center}
.nav em{margin-left:auto;font-style:normal;font-size:11px;background:#ffffff22;padding:2px 8px;border-radius:99px}
.nav:hover{background:#ffffff14}
.nav.on{background:var(--p);color:#fff}
.sp{flex:1}
main{flex:1;min-width:0;padding:24px 30px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:24px;font-weight:800;flex:1}
.top input{max-width:280px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;cursor:pointer;border-left:5px solid var(--c)}
.stat b{font-size:30px;display:block;font-weight:800}
.stat span{color:var(--mu)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:18px}
.box h3{margin-bottom:12px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hl{display:grid;gap:8px}
.hl div{padding:9px 12px;border-radius:10px;background:#dd603e14;display:flex;gap:10px;align-items:center}
.hl .ok{background:#00780016;color:var(--g)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:10px;border-bottom:1.5px solid var(--ln)}
td{padding:10px;border-bottom:1px solid var(--ln)}
tr[draggable=true]{cursor:grab}
tr.ov td{background:#fe28af18}
.chip{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.bd{background:#9b00d214;color:var(--v);padding:3px 9px;border-radius:99px;font-size:12px;margin-right:4px;display:inline-block}
.act{text-align:right;white-space:nowrap}
.act button{background:0;color:var(--mu);padding:7px 9px;border-radius:8px}
.act button:hover{background:#9b00d214;color:var(--v)}
.empty{text-align:center;padding:40px;color:var(--mu)}
#modal{position:fixed;inset:0;background:#150820aa;display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.dlg{background:var(--card);border-radius:20px;width:640px;max-width:100%;max-height:92vh;overflow:auto;padding:24px;display:grid;gap:14px}
.dlg h3{font-size:18px}
.fld label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin-bottom:5px}
.pre{display:flex;gap:12px;align-items:center;background:var(--bg);padding:12px;border-radius:14px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,38px);gap:5px;max-height:210px;overflow:auto;margin-top:8px}
.ct{display:flex;gap:6px;overflow:auto;margin-top:8px;padding-bottom:4px}.ct .btn{white-space:nowrap}
.ig button{height:38px;background:var(--bg);color:var(--tx);border-radius:9px}
.ig button:hover{background:var(--v);color:#fff}
.sw{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ln)}
.sw input{width:42px;height:32px;padding:2px}
.lk{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:6px;margin-bottom:6px}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:99}
.ts{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;border-left:5px solid var(--g);animation:in .25s}
.ts.e{border-color:var(--r)}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.nt{background:linear-gradient(90deg,var(--v),var(--p));color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:12px}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--s)*1%),var(--ln) 0);display:grid;place-items:center}
.ring b{background:var(--card);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.bar{display:flex;gap:10px;align-items:center;margin:7px 0}.bar span{height:10px;border-radius:9px;display:block;background:var(--c)}.bar small{width:110px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn{text-decoration:none}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.gc{background:var(--card);border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:16px;padding:14px;display:grid;gap:6px}.gc img{width:100%;height:110px;object-fit:cover;border-radius:10px}.gi{height:110px;display:grid;place-items:center;background:var(--bg);border-radius:10px}.gc small{color:var(--mu)}
@media(max-width:820px){#app{flex-direction:column}aside{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:static;padding:10px}aside .brand,.sp,.nav em{display:none}.nav{white-space:nowrap}main{padding:16px}.lk{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="login" hidden>
 <form id="lf">
  <h1>Click <b>&</b> Connect</h1>
  <p style="color:var(--mu)">Admin panel me login karein.</p>
  <input id="em" type="email" placeholder="Email" required autocomplete="username">
  <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
  <button class="btn" style="justify-content:center">Login</button>
  <button type="button" id="fg" class="btn alt" style="justify-content:center">Password reset email bhejein</button>
 </form>
</div>
<div id="app" hidden>
 <aside id="nav"></aside>
 <main>
  <div class="top">
   <h2 id="ttl"></h2>
   <input id="q" placeholder="Search karein ( / )" aria-label="Search">
   <button class="btn alt sm" id="kb"><i class="fas fa-bolt"></i> Ctrl+K</button><button class="btn alt sm" id="un" title="Undo (Ctrl+Z)"><i class="fas fa-rotate-left"></i> Undo</button>
  </div>
  <div id="view"></div>
 </main>
</div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyBWyMJvt0OpejwkFEstI_NQToHmMBGwkbE",authDomain:"agency-136b6.firebaseapp.com",projectId:"agency-136b6",storageBucket:"agency-136b6.firebasestorage.app",messagingSenderId:"503663950718",appId:"1:503663950718:web:8a30b18039c279ffac112f"});
const db=firebase.firestore(),auth=firebase.auth(),REF=db.collection('data').doc('matrix_config');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=(p,s)=>s.split(' ').map(n=>p+' fa-'+n);
const CAT={'Documents':mk('fas','folder folder-open file file-alt file-pdf file-word file-excel file-powerpoint file-invoice file-signature file-contract file-download file-upload file-image file-code file-archive copy clipboard clipboard-list clipboard-check book book-open bookmark scroll sticky-note newspaper'),'Government':mk('fas','id-card address-card id-badge fingerprint stamp landmark university gavel balance-scale flag passport vote-yea building-columns user-shield shield-alt certificate award medal'),'Education':mk('fas','graduation-cap user-graduate school book-reader chalkboard-teacher pen-nib pen pencil-alt ruler atlas globe-asia microscope flask brain lightbulb calculator laptop-code'),'Money':mk('fas','rupee-sign wallet credit-card money-bill-wave money-check coins piggy-bank receipt file-invoice-dollar chart-bar chart-line chart-pie percent handshake briefcase store shopping-cart shopping-bag tags tag cash-register hand-holding-dollar'),'Health & Farm':mk('fas','heartbeat hospital stethoscope pills syringe ambulance user-md tractor seedling leaf wheat-awn cow paw tree sun cloud-rain'),'Travel':mk('fas','car bus train subway bicycle motorcycle plane ship truck taxi gas-pump map map-marker-alt location-dot route compass hotel ticket-alt suitcase'),'Tech':mk('fas','globe wifi link external-link-alt cloud server database laptop desktop mobile-alt tablet-alt keyboard print camera video tv headphones microphone qrcode barcode plug bolt microchip code terminal bug robot shield-halved'),'Contact':mk('fas','envelope phone phone-alt comments comment-dots headset share-alt paper-plane bell address-book at inbox rss bullhorn'),'People':mk('fas','user users user-tie user-plus user-check user-lock child baby person-dress people-group hands-helping heart star thumbs-up smile'),'Tools':mk('fas','cog cogs sliders-h wrench hammer tools screwdriver-wrench paint-brush palette magic filter sort search download upload edit trash save sync redo history lock unlock key eye'),'Misc':mk('fas','calendar calendar-check clock hourglass-half stopwatch gift trophy crown fire rocket flag-checkered bullseye cube cubes puzzle-piece gamepad music film utensils coffee pizza-slice'),'Brands':mk('fab','whatsapp facebook instagram youtube twitter telegram google google-drive google-pay paypal linkedin github android apple chrome amazon cc-visa cc-mastercard')};
const ICONS=[...new Set(Object.values(CAT).flat())];
let ct='Sab';
const BR=['#007800','#FE28AF','#9B00D2','#DD603E','#0077BE','#FFA500','#2F4F4F','#C71585'];
const F=(k,l,t,r)=>[k,l,t,r];
const IC=F('icon','Icon','icon'),CO=F('color','Color','color');
const SC={
 folders:{t:'Main Folders',i:'folder',c:'#007800',f:[F('name','Name','text',1),IC,CO],L:x=>x.name},
 subs:{t:'Sub-Portals',i:'folder-open',c:'#9B00D2',f:[F('parent','Main Folder','folder',1),F('name','Name','text',1),IC,CO],L:x=>x.name},
 sideLinks:{t:'Side-Links',i:'link',c:'#FE28AF',f:[F('folder','Main Folder','folder',1),F('sub','Sub-Portal','sub',1),F('label','Link name','text',1),F('url','URL','url',1),IC,CO],L:x=>x.label},
 cards:{t:'Workspace Cards',i:'th-large',c:'#DD603E',f:[F('folder','Main Folder','folder',1),F('sub','Sub-Portal','sub',1),F('title','Heading','text',1),F('url','Redirect URL','url',1),F('desc','Description','area'),F('imageUrl','Image URL','url'),F('showFrom','Dikhana shuru (date)','date'),F('showUntil','Last date, iske baad chhupa dein','date'),IC,CO,F('links','Extra links','links')],L:x=>x.title},
 pdfs:{t:'Drive PDFs',i:'file-pdf',c:'#0077BE',f:[F('title','PDF title','text',1),F('driveLink','Google Drive link','url',1),F('portalLink','Portal link','url'),IC,CO],L:x=>x.title}
 ,apps:{t:'Customers',i:'address-book',c:'#007800',f:[F('customer','Customer name','text',1),F('phone','Phone','text'),F('service','Service','text',1),F('amount','Amount (₹)','num'),F('status','Status','status'),F('date','Date','date'),IC,CO],L:x=>x.customer}
};
const NAV=[['dash','Dashboard','chart-pie'],...Object.keys(SC).map(k=>[k,SC[k].t,SC[k].i]),['analytics','Analytics & Kamai','chart-line'],['tools','Link Checker','link-slash'],['logs','Audit Log','list-check'],['preview','Live Preview','eye'],['settings','Settings','cog']];
const fk=k=>k==='subs'?'parent':'folder';
let D={folders:[],subs:[],sideLinks:[],cards:[],notice:''},P=[],A=[],ROLE='viewer',PM={},ADM=[],mode='table',view='dash',sel=new Set(),fl='',undo=[],drag=-1;
const can=a=>ROLE==='owner'||(PM.act||[]).includes(a);
const see=v=>v==='dash'||(v==='settings'?ROLE==='owner':ROLE==='owner'||(PM.sec||[]).includes(v));
const COL={pdfs:'drive_pdfs',apps:'applications'};
const arr=k=>k==='pdfs'?P:k==='apps'?A:D[k];
const toast=(m,e)=>{const t=document.createElement('div');t.className='ts'+(e?' e':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3200)};
const log=m=>{const l=JSON.parse(localStorage.ctlog||'[]');l.unshift([Date.now(),m]);localStorage.ctlog=JSON.stringify(l.slice(0,30));db.collection('audit').add({at:new Date(),by:auth.currentUser?.email||'',msg:m}).catch(()=>{})};
const hex=c=>{if(/^#[0-9a-f]{6}$/i.test(c||''))return c;const m=(c||'').match(/\d+/g);return m&&m.length>=3?'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join(''):'#9B00D2'};
const okUrl=u=>!u||/^(https?:\/\/|\/|[\w.-]+\.html)/i.test(u);
const chip=x=>`<span class="chip" style="background:${esc(hex(x.color))}"><i class="${esc(x.icon||'fas fa-link')}"></i></span>`;

/* ---------- auth ---------- */
auth.onAuthStateChanged(async u=>{$('#app').hidden=1;$('#login').hidden=0;if(u&&await gate()){$('#login').hidden=1;$('#app').hidden=0;load()}});
async function gate(){const em=auth.currentUser.email.toLowerCase(),R=db.collection('admins');
 try{let d=await R.doc(em).get();
  if(!d.exists){const any=await R.limit(1).get();if(any.empty){await R.doc(em).set({role:'owner',active:true,created:new Date()});d=await R.doc(em).get()}}
  const me=d.exists&&d.data();
  if(!me||me.active===false){await auth.signOut();toast('Aapko access nahi diya gaya hai. Owner se sampark karein.',1);return false}
  ROLE=me.role;PM=me;ADM=ROLE==='owner'?(await R.get()).docs.map(x=>({id:x.id,...x.data()})):[];
  R.doc(em).set({lastLogin:new Date()},{merge:true})}catch(e){await auth.signOut();toast('Access check nahi ho paya.',1);return false}
 return true}
let fails=0,lock=0;
$('#lf').onsubmit=async e=>{e.preventDefault();if(Date.now()<lock)return toast('Bahut galat koshish. 1 minute baad try karein.',1);try{await auth.signInWithEmailAndPassword($('#em').value,$('#pw').value)}catch(x){if(++fails>=5){lock=Date.now()+60000;fails=0}toast('Login fail: email ya password galat hai.',1)}};
$('#fg').onclick=async()=>{const m=$('#em').value;if(!m)return toast('Pehle email likhein.',1);try{await auth.sendPasswordResetEmail(m);toast('Reset email bhej diya.')}catch(x){toast('Email nahi bheja ja saka.',1)}};

/* ---------- data ---------- */
async function load(){
 try{const d=await REF.get();if(d.exists)D=Object.assign(D,d.data());
 const s=await db.collection('drive_pdfs').get();P=s.docs.map(x=>({id:x.id,...x.data()}));
 const a=await db.collection('applications').get();A=a.docs.map(x=>({id:x.id,...x.data()}))}catch(e){toast('Data load nahi hua: '+e.message,1)}
 render()}
async function mut(fn,msg,act='edit'){if(!can(act))return toast('Is action ki permission nahi hai.',1);undo.push(JSON.stringify(D));if(undo.length>25)undo.shift();fn();try{await REF.set(D);log(msg);toast(msg)}catch(e){D=JSON.parse(undo.pop());toast('Save fail: '+e.message,1)}render()}
$('#un').onclick=async()=>{if(!can('edit'))return toast('Is action ki permission nahi hai.',1);if(!undo.length)return toast('Undo ke liye kuch nahi hai.',1);D=JSON.parse(undo.pop());await REF.set(D);toast('Undo ho gaya.');render()};
function ask(m){return new Promise(r=>{const M=$('#modal');M.hidden=0;M.innerHTML=`<div class="dlg"><h3>${esc(m)}</h3><div class="row" style="justify-content:flex-end"><button class="btn alt" id="n">Cancel</button><button class="btn bad" id="y">Haan, kar do</button></div></div>`;$('#y').onclick=()=>{M.hidden=1;r(1)};$('#n').onclick=()=>{M.hidden=1;r(0)}})}

/* ---------- render ---------- */
function render(){if(!see(view))view='dash';
 $('#nav').innerHTML=`<div class="brand">Click <b>&</b> Connect</div>`+NAV.filter(n=>see(n[0])).map(([k,t,i])=>`<button class="nav ${k===view?'on':''}" data-v="${k}"><i class="fas fa-${i}"></i>${t}${SC[k]?`<em>${arr(k).length}</em>`:''}</button>`).join('')+`<div class="sp"></div><button class="nav" data-v="out"><i class="fas fa-right-from-bracket"></i>Logout</button>`;
 $('#ttl').textContent=(NAV.find(n=>n[0]===view)||[])[1];
 $('#q').style.display=SC[view]?'':'none';
 $('#view').innerHTML=view==='dash'?dash():view==='settings'?sets():view==='preview'?pvw():view==='analytics'?ana():view==='tools'?tools():view==='logs'?logs():list(view);
 if(view==='settings')loadBk();if(view==='analytics')loadAna();if(view==='logs')loadLogs()}
$('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;if(b.dataset.v==='out')return auth.signOut();go(b.dataset.v)};
function go(v){view=v;sel.clear();fl='';$('#q').value='';render()}
$('#q').oninput=render;

function health(){
 const h=[],c=D.cards,u=x=>x.url&&!okUrl(x.url);
 D.folders.forEach(f=>{if(!D.subs.some(s=>s.parent===f.name))h.push(`Folder "${f.name}" me koi sub-portal nahi hai`)});
 D.subs.forEach(s=>{if(!c.some(x=>x.folder===s.parent&&x.sub===s.name)&&!D.sideLinks.some(x=>x.folder===s.parent&&x.sub===s.name))h.push(`Sub-portal "${s.name}" khali hai`)});
 c.forEach(x=>{if(!x.url&&!(x.links||[]).length)h.push(`Card "${x.title}" me koi link nahi`);if(u(x))h.push(`Card "${x.title}" ka URL galat lagta hai`);if(!D.folders.some(f=>f.name===x.folder))h.push(`Card "${x.title}" ka folder missing hai`)});
 D.sideLinks.forEach(x=>{if(u(x))h.push(`Side-link "${x.label}" ka URL galat hai`)});
 return h}
function dash(){
 const hs=health(),mx=Math.max(1,...D.folders.map(f=>D.cards.filter(c=>c.folder===f.name).length)),sc=Math.max(0,100-hs.length*8),lg=JSON.parse(localStorage.ctlog||'[]');
 return `${D.notice?`<div class="nt"><i class="fas fa-bell"></i> ${esc(D.notice)}</div>`:''}
 <div class="stats">${Object.keys(SC).map(k=>`<div class="stat" style="--c:${SC[k].c}" data-v="${k}"><b>${arr(k).length}</b><span>${SC[k].t}</span></div>`).join('')}</div>
 <div class="box"><div class="row" style="gap:28px"><div class="ring" style="--s:${sc}"><b>${sc}</b></div><div style="flex:1;min-width:220px"><h3>Site health score · folder ke hisaab se cards</h3>${D.folders.length?D.folders.map(f=>{const n=D.cards.filter(c=>c.folder===f.name).length;return `<div class="bar" style="--c:${esc(hex(f.color))}"><small>${esc(f.name)}</small><span style="width:${Math.max(4,n/mx*100)}%"></span><b>${n}</b></div>`}).join(''):'<p class="empty">Folder banate hi chart dikhega.</p>'}</div></div></div>
 <div class="box"><h3><i class="fas fa-stethoscope"></i> Site health</h3><div class="hl">${hs.length?hs.slice(0,12).map(x=>`<div><i class="fas fa-triangle-exclamation"></i>${esc(x)}</div>`).join('')+(hs.length>12?`<div>+${hs.length-12} aur</div>`:''):'<div class="ok"><i class="fas fa-circle-check"></i>Sab kuch theek hai.</div>'}</div></div>
 <div class="box"><h3><i class="fas fa-clock-rotate-left"></i> Recent activity</h3>${lg.length?lg.slice(0,8).map(([t,m])=>`<p style="padding:6px 0;border-bottom:1px solid var(--ln)">${esc(m)} <span style="color:var(--mu);float:right">${new Date(t).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}</span></p>`).join(''):'<p class="empty">Abhi koi activity nahi.</p>'}</div>`}

function list(k){return k==='cards'&&mode==='grid'?grid():list0(k)}
function list0(k){
 const s=SC[k],q=$('#q').value.toLowerCase(),isP=!!COL[k];

function toggleTheme(){const d=document.documentElement;d.dataset.t=d.dataset.t==='dark'?'':'dark';localStorage.ctt=d.dataset.t}
function pal(){const M=$('#modal');M.hidden=0;M.innerHTML='<div class="dlg"><input id="pi" placeholder="Kuch bhi dhundhein: card, folder, setting..."><div id="pr" class="hl"></div></div>';
 const all=[...NAV.map(n=>({l:n[1]+' kholein',i:n[2],f:()=>go(n[0])})),...Object.keys(SC).flatMap(k=>arr(k).map((x,i)=>({l:SC[k].L(x),s:SC[k].t,i:SC[k].i,f:()=>{go(k);form(k,i)}}))),{l:'Naya card banayein',i:'plus',f:()=>{go('cards');form('cards')}},{l:'Dark / Light mode',i:'moon',f:toggleTheme},{l:'Undo',i:'rotate-left',f:()=>$('#un').click()}];
 const show=()=>{const q=$('#pi').value.toLowerCase();$('#pr').r=all.filter(a=>(a.l+(a.s||'')).toLowerCase().includes(q)).slice(0,9);$('#pr').innerHTML=$('#pr').r.map((a,j)=>`<div data-j="${j}" style="cursor:pointer;background:var(--bg)"><i class="fas fa-${a.i}"></i>${esc(a.l)}<small style="margin-left:auto;color:var(--mu)">${esc(a.s||'')}</small></div>`).join('')};
 const run=j=>{const a=$('#pr').r[j];if(a){M.hidden=1;a.f()}};
 show();$('#pi').focus();$('#pi').oninput=show;$('#pi').onkeydown=e=>{if(e.key==='Enter')run(0)};$('#pr').onclick=e=>{const d=e.target.closest('[data-j]');if(d)run(+d.dataset.j)}}
$('#kb').onclick=pal;
const TD=()=>new Date().toISOString().slice(0,10);
const sched=x=>x.showUntil&&TD()>x.showUntil?'<span class="bd" style="background:#dd603e22;color:var(--r)">Expired</span>':x.showFrom&&TD()<x.showFrom?'<span class="bd">Scheduled</span>':'';
const STC={Pending:'#DD603E',Processing:'#9B00D2',Done:'#007800',Delivered:'#0077BE'};
const appCell=x=>{const st=x.status||'Pending',ph=(x.phone||'').replace(/\D/g,'').slice(-10);return `<span class="bd" style="background:${STC[st]}22;color:${STC[st]}">${esc(st)}</span> ₹${+x.amount||0} ${ph?`<a href="https://wa.me/91${ph}?text=${encodeURIComponent('Namaste '+x.customer+', aapka '+x.service+' ka kaam: '+st+'. - Click & Connect')}" target="_blank" title="WhatsApp bhejein"><i class="fab fa-whatsapp" style="color:#25D366"></i></a>`:''}`};
function grid(){const q=$('#q').value.toLowerCase();return `<div class="row" style="margin-bottom:14px"><button class="btn" data-a="add" data-k="cards"><i class="fas fa-plus"></i> Naya add karein</button><button class="btn alt" data-a="mode"><i class="fas fa-table"></i> Table view</button></div><div class="gr">${D.cards.map((x,i)=>({x,i})).filter(({x})=>!q||JSON.stringify(x).toLowerCase().includes(q)).map(({x,i})=>`<div class="gc" style="--c:${esc(hex(x.color))};opacity:${x.hidden?.45:1}">${x.imageUrl?`<img src="${esc(x.imageUrl)}" alt="">`:`<div class="gi">${chip(x)}</div>`}<b>${x.pinned?'⭐ ':''}${esc(x.title)}</b><small>${esc(x.folder)} › ${esc(x.sub)}</small>${sched(x)}<div class="act"><button data-a="pin" data-k="cards" data-i="${i}"><i class="fas fa-star"></i></button><button data-a="edit" data-k="cards" data-i="${i}"><i class="fas fa-pen"></i></button><button data-a="dup" data-k="cards" data-i="${i}"><i class="fas fa-clone"></i></button><button data-a="del" data-k="cards" data-i="${i}"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>`}
const ana=()=>{const td=TD(),rv=f=>A.filter(f).reduce((t,x)=>t+(+x.amount||0),0);return `<div class="stats"><div class="stat" style="--c:#007800"><b>₹${rv(x=>x.date===td)}</b><span>Aaj ki kamai</span></div><div class="stat" style="--c:#9B00D2"><b>₹${rv(x=>(x.date||'').slice(0,7)===td.slice(0,7))}</b><span>Is mahine ki kamai</span></div><div class="stat" style="--c:#DD603E"><b>${A.filter(x=>!['Done','Delivered'].includes(x.status||'Pending')).length}</b><span>Pending kaam</span></div></div><div class="box"><h3>Sabse zyada click hue cards</h3><div id="an">Loading...</div></div><div class="box"><h3>Jin par abhi tak click nahi hua</h3><div id="an2" class="hl"></div></div>`};
async function loadAna(){try{const r=await db.collection('clicks').get(),m={};r.docs.forEach(d=>m[d.data().title]=d.data().count||0);const t=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10),mx=Math.max(1,...t.map(a=>a[1]));$('#an').innerHTML=t.length?t.map(([n,c])=>`<div class="bar" style="--c:#9B00D2"><small>${esc(n)}</small><span style="width:${Math.max(4,c/mx*100)}%"></span><b>${c}</b></div>`).join(''):'<p class="empty">Abhi click data nahi hai. Index page me click-counter jodein.</p>';const u=D.cards.filter(c=>!m[c.title]);$('#an2').innerHTML=u.length?u.slice(0,15).map(c=>`<div>${esc(c.title)}</div>`).join(''):'<div class="ok">Sab cards use ho rahe hain.</div>'}catch(e){$('#an').textContent='Clicks load nahi hue.'}}
const tools=()=>`<div class="box"><h3><i class="fas fa-link-slash"></i> Link checker</h3><p style="color:var(--mu);margin-bottom:12px">Saare card aur side-link URLs check hote hain. Ye band ya unreachable websites pakadta hai; 404 page nahi.</p><button class="btn" id="lc"><i class="fas fa-play"></i> Check shuru karein</button><div id="lo" class="hl" style="margin-top:14px"></div></div>`;
async function chk(){const L=[...D.cards.map(c=>[c.url,c.title]),...D.cards.flatMap(c=>(c.links||[]).map(l=>[l.url,c.title+' › '+l.title])),...D.sideLinks.map(l=>[l.url,l.label])].filter(a=>/^https?:/.test(a[0])),bad=[],o=$('#lo');
 for(let i=0;i<L.length;i+=6){o.textContent=`Check ho raha hai ${i}/${L.length}...`;await Promise.all(L.slice(i,i+6).map(async([u,n])=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{await fetch(u,{mode:'no-cors',signal:c.signal})}catch(e){bad.push([u,n])}clearTimeout(t)}))}
 o.innerHTML=bad.length?bad.map(([u,n])=>`<div><i class="fas fa-link-slash"></i><b>${esc(n)}</b> <small>${esc(u)}</small></div>`).join(''):'<div class="ok">Sab links khul rahe hain.</div>';toast(bad.length?bad.length+' link kharab mile':'Sab links theek hain',bad.length)}
const logs=()=>`<div class="box"><div id="lg" class="hl">Loading...</div></div>`;
async function loadLogs(){try{const r=await db.collection('audit').orderBy('at','desc').limit(60).get();$('#lg').innerHTML=r.empty?'<p class="empty">Abhi koi record nahi.</p>':r.docs.map(d=>{const x=d.data();return `<div style="background:var(--bg)"><b>${esc((x.by||'').split('@')[0])}</b>${esc(x.msg)}<small style="margin-left:auto;color:var(--mu)">${x.at?.toDate().toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}</small></div>`}).join('')}catch(e){$('#lg').textContent='Log load nahi hua.'}}
let idle;const rst=()=>{clearTimeout(idle);idle=setTimeout(()=>{if(auth.currentUser){toast('Inactive rehne se logout ho gaya.');auth.signOut()}},15*60*1000)};['click','keydown','mousemove'].forEach(ev=>document.addEventListener(ev,rst));rst();
const SECS=[['folders','Main Folders'],['subs','Sub-Portals'],['sideLinks','Side-Links'],['cards','Cards'],['pdfs','PDFs'],['apps','Customers'],['analytics','Analytics'],['tools','Link Checker'],['logs','Audit Log'],['preview','Preview']],ACTS=[['add','Add'],['edit','Edit'],['delete','Delete']];
const team=()=>ROLE!=='owner'?'':`<div class="box"><h3><i class="fas fa-user-shield"></i> Team access</h3><p style="color:var(--mu);margin-bottom:12px">Sirf yahan jude hue log hi login kar sakte hain. Account banayein aur chunein ki woh kya dekh aur kar sakta hai.</p>
<div class="row"><input id="ae" placeholder="Email" style="max-width:230px"><input id="ap" placeholder="Temporary password (6+)" style="max-width:210px"><select id="arl" style="max-width:130px"><option>editor</option><option>viewer</option><option>owner</option></select><button class="btn" id="ar"><i class="fas fa-user-plus"></i> Account banayein</button></div>
<div style="margin-top:14px;display:grid;gap:10px">${ADM.map(tm).join('')}</div></div>`;
const tm=a=>{const own=a.role==='owner',off=a.active===false,cb=(t,k,l)=>`<label><input type="checkbox" style="width:auto" data-pm="${t}:${k}" data-u="${esc(a.id)}" ${(a[t]||[]).includes(k)?'checked':''}> ${l}</label>`;return `<div class="gc" style="--c:${off?'#DD603E':'#007800'}"><div class="row"><b>${esc(a.id)}</b><span class="bd">${esc(a.role)}</span>${off?'<span class="bd" style="color:var(--r)">Blocked</span>':''}<small style="margin-left:auto">${a.lastLogin?.toDate?'Last login: '+a.lastLogin.toDate().toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'}):'Abhi tak login nahi'}</small></div>${own?'<small>Owner ko poora access hai.</small>':`<div class="row">${SECS.map(([k,l])=>cb('sec',k,l)).join('')}</div><div class="row">${ACTS.map(([k,l])=>cb('act',k,l)).join('')}</div>`}<div class="row"><button class="btn alt sm" data-rs="${esc(a.id)}"><i class="fas fa-key"></i> Password reset email</button>${own?'':`<button class="btn alt sm" data-bl="${esc(a.id)}">${off?'Unblock karein':'Block karein'}</button><button class="btn alt sm" data-rm="${esc(a.id)}"><i class="fas fa-trash"></i> Access hatayein</button>`}</div></div>`};
/* ---------- global keys ---------- */
document.documentElement.dataset.t=localStorage.ctt||'';
document.addEventListener('keydown',e=>{const t=e.target.tagName,typing=/INPUT|TEXTAREA|SELECT/.test(t);
 if(e.key==='Escape')$('#modal').hidden=1;if(e.key==='k'&&(e.ctrlKey||e.metaKey)){e.preventDefault();pal()}
 if(e.key==='/'&&!typing&&SC[view]){e.preventDefault();$('#q').focus()}
 if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!typing){e.preventDefault();$('#un').click()}});
</script>
</body>
</html>
